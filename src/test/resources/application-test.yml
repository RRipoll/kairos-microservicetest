spring:
  # Fast H2 configuration for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        "[use_sql_comments]": false
        "[generate_statistics]": false
        
  sql:
    init:
      mode: never  # Disable data.sql loading for tests
        
  h2:
    console:
      enabled: false
      
# Disable unnecessary features for faster startup
logging:
  level:
    "[com.testjava.priceservice]": WARN
    "[org.springframework]": WARN
    "[org.hibernate]": WARN
    root: ERROR
    
# Test-specific configurations
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Test security credentials (used by TestRestTemplate in integration tests)
app:
  security:
    user:
      username: user
      password: test