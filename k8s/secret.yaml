apiVersion: v1
kind: Secret
metadata:
  name: price-service-secret
  labels:
    app: price-service
type: Opaque
stringData:
  # SECURITY WARNING: DO NOT COMMIT REAL SECRETS TO VERSION CONTROL
  #
  # This file contains PLACEHOLDER values for demonstration purposes only.
  # In production, use one of these approaches:
  #   1. kubectl create secret generic price-service-secret \
  #        --from-literal=TESTJAVA_DB_PASSWORD=<strong-password> \
  #        --from-literal=APP_SECURITY_USER=<username> \
  #        --from-literal=APP_SECURITY_PASSWORD=<strong-password>
  #   2. Use External Secrets Operator (ESO) with HashiCorp Vault, AWS Secrets Manager, etc.
  #   3. Use Sealed Secrets for GitOps workflows
  #
  # These placeholder values should be replaced before deployment
  TESTJAVA_DB_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  APP_SECURITY_USER: "REPLACE_WITH_USERNAME"
  APP_SECURITY_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
